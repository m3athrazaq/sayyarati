# Emulator test of a debug build (native/selftest: system file picker, "Open with", "Share",
# export, restore, restart); results and screenshots go to the "ci-android-smoke" pre-release.
# Started by hand (Actions > Android emulator test > Run workflow). On GitHub's standard runners the
# emulator currently boots but is too slow to run the app's WebView test reliably, so it is not run on
# every change; the release build does not depend on it.
name: Android emulator test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator
  cancel-in-progress: true

env:
  APP_VERSION: '1.1.1'

jobs:
  emulator-test:
    runs-on: ubuntu-24.04   # pinned: the Android emulator does not boot on the new ubuntu-latest image
    timeout-minutes: 55
    permissions:
      contents: write   # to publish the test results as a pre-release
    steps:
      - name: Hardware acceleration for the emulator
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          if [ -c /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No hardware acceleration (/dev/kvm) on this runner, so the Android emulator cannot run here; the emulator test is skipped. (GitHub provides it on runners for public repositories.)"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.kvm.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: steps.kvm.outputs.ok == 'true'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.kvm.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.kvm.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: App files + self-test hook (test build only)
        if: steps.kvm.outputs.ok == 'true'
        run: |
          python3 tools/stamp.py --check
          rm -rf native/www && mkdir -p native/www
          cp -R index.html app.js manifest.webmanifest *.png vendor fonts native/www/
          cp native/selftest/selftest.js native/selftest/fixture-f150-layout.xlsx native/www/
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("native/www/index.html")
          s = p.read_text(encoding="utf-8")
          p.write_text(s.replace("</body>", '<script src="selftest.js"></script>\n</body>'), encoding="utf-8")
          PY

      - name: Install + sync
        if: steps.kvm.outputs.ok == 'true'
        working-directory: native
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx cap sync android

      - name: Build the test APK
        if: steps.kvm.outputs.ok == 'true'
        working-directory: native/android
        run: |
          chmod +x gradlew
          if ! ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:|e: |What went wrong|FAILURE|\.java:[0-9]+" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            tail -80 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          ls -la app/build/outputs/apk/debug/

      - name: Gradle download checksum (for pinning in gradle-wrapper.properties)
        if: steps.kvm.outputs.ok == 'true'
        run: |
          Z=$(find ~/.gradle/wrapper/dists -name 'gradle-*.zip' | head -1)
          [ -n "$Z" ] && echo "::notice::$(basename "$Z") sha256 $(sha256sum "$Z" | cut -d' ' -f1); official $(curl -sfL "https://services.gradle.org/distributions/$(basename "$Z").sha256" || echo '?')" || true

      - name: Run in the emulator (Android 15)
        if: steps.kvm.outputs.ok == 'true'
        timeout-minutes: 32
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-boot-timeout: 900
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash native/selftest/android-smoke.sh

      - name: Publish results
        if: always() && steps.kvm.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          find smoke -type f -empty -delete 2>/dev/null || true
          ls -la smoke || true
          if [ -f smoke/selftest-result.txt ]; then
            grep -E "^(FAIL|ERROR)" smoke/selftest-result.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^PASS" smoke/selftest-result.txt | head -40 | while IFS= read -r l; do echo "::notice::$l"; done
          else
            echo "::error::no result file from the emulator test"
          fi
          gh release delete ci-android-smoke --repo "$REPO" --yes --cleanup-tag || true
          gh release create ci-android-smoke smoke/* --repo "$REPO" --target "$SHA" \
            --prerelease --latest=false --title "CI Android emulator test" --notes "Automated emulator run for $SHA" || true

