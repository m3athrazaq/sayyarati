# Runs the Android app in an emulator, drives it with native/selftest/selftest.js and
# native/selftest/android-smoke.sh (system file picker, "Open with", "Share", export, restore,
# restart), and publishes screenshots + results to the "ci-android-smoke" pre-release.
name: Android emulator test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'vendor/**'
      - 'native/**'
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

concurrency:
  group: android-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write   # to publish the test results as a pre-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: App files + self-test hook (test build only)
        run: |
          rm -rf native/www && mkdir -p native/www
          cp -R index.html app.js manifest.webmanifest *.png vendor fonts native/www/
          cp native/selftest/selftest.js native/selftest/fixture-f150-layout.xlsx native/www/
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("native/www/index.html")
          s = p.read_text(encoding="utf-8")
          p.write_text(s.replace("</body>", '<script src="selftest.js"></script>\n</body>'), encoding="utf-8")
          PY

      - name: Install + sync
        working-directory: native
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx cap sync android

      - name: Build the test APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          if ! ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:|e: |What went wrong|FAILURE|\.java:[0-9]+" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            tail -80 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          ls -la app/build/outputs/apk/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator (Android 15)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash native/selftest/android-smoke.sh

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          find smoke -type f -empty -delete 2>/dev/null || true
          ls -la smoke || true
          if [ -f smoke/selftest-result.txt ]; then
            grep -E "^(FAIL|ERROR)" smoke/selftest-result.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^PASS" smoke/selftest-result.txt | head -40 | while IFS= read -r l; do echo "::notice::$l"; done
          fi
          gh release delete ci-android-smoke --repo "$REPO" --yes --cleanup-tag || true
          gh release create ci-android-smoke smoke/* --repo "$REPO" --target "$SHA" \
            --prerelease --latest=false --title "CI Android emulator test" --notes "Automated emulator run for $SHA"
