<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيّارتي</title>
<meta name="description" content="سجل السيارة: الزيوت والصيانة والمصاريف لأكثر من سيارة، مع نسخة احتياطية بملف إكسل.">
<meta name="theme-color" content="#12262E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سيّارتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Readex";font-weight:300;font-display:swap;src:url(fonts/readex-pro-arabic-300-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:400;font-display:swap;src:url(fonts/readex-pro-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:500;font-display:swap;src:url(fonts/readex-pro-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:700;font-display:swap;src:url(fonts/readex-pro-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:300;font-display:swap;src:url(fonts/readex-pro-latin-300-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:"Readex";font-weight:400;font-display:swap;src:url(fonts/readex-pro-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:"Readex";font-weight:500;font-display:swap;src:url(fonts/readex-pro-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:"Readex";font-weight:700;font-display:swap;src:url(fonts/readex-pro-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}

:root{
  --ink:#12262E;        /* deep petrol — instrument panel */
  --ink-2:#1C3943;
  --amber:#E9A23B;      /* dashboard backlight */
  --amber-soft:#F6DDB1;
  --steel:#5F7177;
  --line:#D5DEDC;
  --bg:#E8EDEC;
  --card:#FFFFFF;
  --text:#14242A;
  --muted:#62747A;
  --ok:#2F7D5B;
  --warn:#C9842A;
  --bad:#B9452F;
  --car:#E9A23B;
  --shadow:0 1px 0 rgba(18,38,46,.06),0 8px 24px -14px rgba(18,38,46,.35);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D1A1F; --card:#15252B; --text:#E6EEEC; --muted:#8FA3A8; --line:#24383F;
  --ink:#091317; --ink-2:#12262E; --steel:#8FA3A8; --amber-soft:#3A2F1C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A1F; --card:#15252B; --text:#E6EEEC; --muted:#8FA3A8; --line:#24383F;
    --ink:#091317; --ink-2:#12262E; --steel:#8FA3A8; --amber-soft:#3A2F1C;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Readex",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55;
  min-height:100dvh;padding-bottom:calc(92px + env(safe-area-inset-bottom));font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px}
.car-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:999px;padding:7px 14px 7px 10px;min-width:0;flex:1;max-width:max-content}
.car-pill .dot{width:12px;height:12px;border-radius:50%;background:var(--car);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.car-pill b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-pill svg{flex:none;opacity:.7}
.top .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:inherit}
.icon-btn:active{background:rgba(255,255,255,.1)}

main{max-width:720px;margin:0 auto;padding:0 16px}
.view{display:none}
.view.on{display:block}

/* ---------- hero: instrument cluster ---------- */
.cluster{background:var(--ink);color:#fff;margin:0 -16px;padding:6px 20px 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.cluster::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:120%;background:radial-gradient(closest-side,rgba(233,162,59,.16),transparent);pointer-events:none}
.car-name{font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:8px 0 2px;word-break:break-word}
.car-sub{color:#A9BCC1;font-size:14px;margin:0 0 18px}
.odo-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.odo-label{font-size:13px;color:#A9BCC1;margin-bottom:6px}
.odo{display:inline-flex;direction:ltr;gap:4px;padding:8px;background:#06100F;border-radius:12px;box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.odo .d{width:min(9vw,40px);height:min(13vw,56px);overflow:hidden;border-radius:6px;background:linear-gradient(#1a2a2e,#0c1719 45%,#0c1719 55%,#1a2a2e);position:relative}
.odo .d::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.odo .strip{display:flex;flex-direction:column;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.odo .strip span{height:min(13vw,56px);display:grid;place-items:center;font-size:min(8vw,34px);font-weight:500;color:#F3EEE4}
.odo .d.km{background:linear-gradient(#5a3d12,#2c1e0a 45%,#2c1e0a 55%,#5a3d12)}
.odo .d.km span{color:var(--amber)}
.odo-unit{font-size:14px;color:#A9BCC1;margin-inline-start:6px;align-self:flex-end;padding-bottom:6px}
.odo-btn{background:var(--amber);color:#1b1306;font-weight:500;border-radius:999px;padding:9px 16px;font-size:14px}
@media (prefers-reduced-motion:reduce){.odo .strip{transition:none}}

/* ---------- blocks ---------- */
.block{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.block h2{font-size:17px;font-weight:500;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.block h2 .act{margin-inline-start:auto;font-size:14px;color:var(--muted);font-weight:400;padding:4px 8px;border-radius:8px}
.lift{margin-top:-14px;position:relative;z-index:2}

.due{display:flex;gap:16px;align-items:center}
.gauge{flex:none;width:118px;height:70px}
.due-txt b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.due-txt small{color:var(--muted);font-size:13.5px;display:block}
.due-list .due + .due{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stat{padding:2px 10px}
.stat + .stat{border-inline-start:1px solid var(--line)}
.stat:first-child{padding-inline-start:0}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{font-size:17px;font-weight:500;white-space:nowrap}
.stat em{font-style:normal;font-size:12px;color:var(--muted);margin-inline-start:3px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0}
.kv dt{color:var(--muted);font-size:14.5px}
.kv dd{margin:0;text-align:end;font-weight:500}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-track{height:10px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;background:var(--car);border-radius:6px}

/* ---------- records ---------- */
.seg{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--amber);color:#1b1306}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--amber);color:#1b1306}}
.chip .cnt{font-size:12px;opacity:.65}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 2px 6px}
.sec-head h1{font-size:28px;margin:0;font-weight:700;line-height:1.1}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec-total{text-align:end}
.sec-total small{display:block;color:var(--muted);font-size:12.5px}
.sec-total b{font-size:20px}
.search{width:100%;margin:10px 0 4px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:11px 14px}

.log{list-style:none;margin:10px 0 0;padding:0;position:relative}
.log li{position:relative;padding-inline-start:26px}
.log li::before{content:"";position:absolute;inset-inline-start:7px;top:0;bottom:0;width:2px;background:var(--line)}
.log li:first-child::before{top:26px}
.log li:last-child::before{bottom:calc(100% - 26px)}
.log li::after{content:"";position:absolute;inset-inline-start:2px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--car)}
.entry{display:block;width:100%;text-align:start;background:var(--card);border-radius:var(--r-md);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.entry-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.entry-title{font-weight:500;font-size:15.5px}
.entry-amt{font-weight:500;white-space:nowrap}
.entry-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px;margin-top:5px}
.entry-meta span b{color:var(--text);font-weight:500}
.gap-tag{display:inline-block;background:var(--amber-soft);color:#6b4a12;border-radius:6px;padding:0 7px;font-size:12.5px}
:root[data-theme="dark"] .gap-tag{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gap-tag{color:var(--amber)}}

.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:500;margin-bottom:6px}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);padding:13px 18px;font-weight:500;background:var(--ink);color:#fff;min-height:48px}
.btn.amber{background:var(--amber);color:#1b1306}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}
:root[data-theme="dark"] .btn:not(.amber):not(.ghost):not(.danger){background:#2A4650}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.amber):not(.ghost):not(.danger){background:#2A4650}}

.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:12px 13px;min-height:48px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.field .hint.warn{color:var(--warn)}
.calc{background:var(--bg);border-radius:var(--r-sm);padding:12px 13px;font-weight:500}
input[type="number"]{direction:ltr;text-align:right}
input[type="date"]{direction:ltr;text-align:right}

/* ---------- bottom nav ---------- */
.nav{position:fixed;inset:auto 0 0 0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button[aria-current="page"]{color:var(--text);font-weight:500}
.nav button[aria-current="page"] svg{color:var(--amber)}
.fab{width:62px!important;height:62px;justify-self:center;margin-top:-30px;border-radius:50%!important;background:var(--amber)!important;color:#1b1306!important;
  box-shadow:0 10px 24px -8px rgba(233,162,59,.8),0 0 0 6px var(--bg);display:grid!important;place-items:center}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,17,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:41;background:var(--card);border-radius:26px 26px 0 0;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;max-width:720px;margin:0 auto;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 18px 6px;position:relative}
.sheet-head::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-head h3{margin:12px 0 4px;font-size:20px;font-weight:700;flex:1}
.sheet-body{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.pick{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick .chip{box-shadow:none;border:1px solid var(--line)}
.pick .chip .dot{width:10px;height:10px;border-radius:50%}

.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item small{display:block;color:var(--muted);font-size:13px}
.list-item .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--steel)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--text)}

.col-edit{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col-edit input,.col-edit select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:9px 10px;min-height:42px}
.col-edit .tools{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.col-edit .tools button{width:38px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--steel)}
.col-edit .tools button.del{color:var(--bad)}
.sub-h{font-size:15px;font-weight:500;margin:18px 0 10px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--amber)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;
  z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:14.5px;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* welcome */
.welcome{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
.welcome h1{font-size:44px;line-height:1.05;margin:16px 0 10px}
.welcome p{color:var(--muted);margin:0 0 26px;max-width:34ch}
.welcome .btn{margin-bottom:10px}
.backup-note{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border-radius:var(--r-md);padding:11px 14px;font-size:14px;margin-top:14px}
.backup-note button{margin-inline-start:auto;font-weight:500;text-decoration:underline}
</style>
</head>
<body>

<header class="top" id="top">
  <button class="car-pill" id="carPill" aria-label="تبديل السيارة">
    <span class="dot"></span><b id="carPillName">—</b>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <span class="sp"></span>
  <button class="icon-btn" id="quickExport" aria-label="نسخة احتياطية إكسل">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
  </button>
</header>

<main>
  <section class="view" id="v-welcome"></section>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-logs"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-settings"></section>
</main>

<nav class="nav" id="nav">
  <button data-v="home" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg>
    السيارة</button>
  <button data-v="logs">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
    السجلات</button>
  <button class="fab" id="fab" aria-label="تسجيل جديد">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-v="stats">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
    المصاريف</button>
  <button data-v="settings">

/* ======================================================================

const APP_VERSION = '1.0.0';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const TYPES = {

};
const CAR_COLORS = ['#E9A23B', '#3F8FD2', '#2F7D5B', '#B9452F', '#7B5CC4', '#8A9499', '#D46A9A', '#1F1F1F'];

const ICONS = {

  wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.6-.6-.6-2.6z"/>',
  fuel: '<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10"/><path d="M14 8l3 3v6a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  tire: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/>',

  drop: '<path d="M7 16a5 5 0 0 0 10 0c0-3-5-9-5-9s-5 6-5 9z"/><path d="M4 21h16"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
const icon = (k, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.doc}</svg>`;

/* ---------- templates ---------- */
const COL = (id, label, type) => ({ id, label, type });
const SECTION_TEMPLATES = {
  oil: () => ({ id: 'oil', name: 'الزيوت', icon: 'oil', note: '', reminderKm: 7500,

  maint: () => ({ id: 'maint', name: 'الصيانة', icon: 'wrench', note: '', reminderKm: 0,
    columns: [COL('desc','بيان','text'), COL('odo','العداد','odometer'), COL('date','التاريخ','date'), COL('amount','المبلغ','money'), COL('notes','ملاحظات','text')], rows: [] }),
  fuel: () => ({ id: 'fuel', name: 'الوقود', icon: 'fuel', note: '', reminderKm: 0,
    columns: [COL('date','التاريخ','date'), COL('odo','العداد','odometer'), COL('dist','المسافة','distance'), COL('liters','اللترات','number'), COL('amount','المبلغ','money'), COL('station','المحطة','text')], rows: [] }),
  tires: () => ({ id: 'tires', name: 'الإطارات', icon: 'tire', note: '', reminderKm: 0,
    columns: [COL('desc','بيان','text'), COL('odo','العداد','odometer'), COL('date','التاريخ','date'), COL('brand','النوع والمقاس','text'), COL('amount','المبلغ','money'), COL('notes','ملاحظات','text')], rows: [] }),
  ins: () => ({ id: 'ins', name: 'التأمين والترخيص', icon: 'shield', note: '', reminderKm: 0,
    columns: [COL('desc','بيان','text'), COL('date','التاريخ','date'), COL('expiry','تاريخ الانتهاء','date'), COL('amount','المبلغ','money'), COL('notes','ملاحظات','text')], rows: [] }),
  wash: () => ({ id: 'wash', name: 'الغسيل والعناية', icon: 'drop', note: '', reminderKm: 0,
    columns: [COL('desc','بيان','text'), COL('date','التاريخ','date'), COL('amount','المبلغ','money'), COL('notes','ملاحظات','text')], rows: [] }),
  blank: () => ({ id: uid(), name: 'قسم جديد', icon: 'star', note: '', reminderKm: 0,
    columns: [COL(uid(),'بيان','text'), COL(uid(),'التاريخ','date'), COL(uid(),'المبلغ','money'), COL(uid(),'ملاحظات','text')], rows: [] })
};
const TEMPLATE_NAMES = { oil: 'الزيوت', maint: 'الصيانة', fuel: 'الوقود', tires: 'الإطارات', ins: 'التأمين والترخيص', wash: 'الغسيل والعناية', blank: 'قسم فارغ' };
const defaultCardFields = () => [
  { id: 'price', label: 'سعر الشراء', type: 'money', value: '' },
  { id: 'pdate', label: 'تاريخ الشراء', type: 'date', value: '' },
  { id: 'model', label: 'الموديل', type: 'number', value: '' },
  { id: 'odo0', label: 'العداد عند الشراء', type: 'odometer', value: '' },
  { id: 'plate', label: 'رقم اللوحة', type: 'text', value: '' }
];
function newCar(name, fromCar) {
  const car = { id: uid(), name: name || 'سيارة جديدة', color: CAR_COLORS[0], odoNow: null, created: Date.now() };
  if (fromCar) {
    car.cardFields = fromCar.cardFields.map(f => ({ ...clone(f), value: '' }));
    car.sections = fromCar.sections.map(s => ({ ...clone(s), note: '', rows: [] }));
  } else {
    car.cardFields = defaultCardFields();
    car.sections = [SECTION_TEMPLATES.oil(), SECTION_TEMPLATES.maint()];
  }
  return car;
}

/* ---------- state ---------- */
let S = null;
function blankState() { return { v: 1, cars: [], activeCar: null, settings: { currency: 'د.ك', decimals: 3, theme: 'auto' }, lastBackup: 0, rev: 0 }; }
function loadLocal() {
  try { const t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch (e) {}
  return null;
}
async function loadNative() {
  const fs = plug('Filesystem'); if (!fs) return null;
  try { const r = await fs.readFile({ path: NATIVE_FILE, directory: 'DATA', encoding: 'utf8' }); return JSON.parse(r.data); } catch (e) { return null; }
}
let saveTimer = null;
function save() {
  S.rev = (S.rev || 0) + 1;
  const json = JSON.stringify(S);
  try { localStorage.setItem(KEY, json); } catch (e) {}
  if (isNative) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const fs = plug('Filesystem');
      if (fs) fs.writeFile({ path: NATIVE_FILE, data: JSON.stringify(S), directory: 'DATA', encoding: 'utf8', recursive: true }).catch(e => console.warn(e));
    }, 150);
  }
}
const car = () => S.cars.find(c => c.id === S.activeCar) || S.cars[0];

/* ---------- formatting ---------- */
const nf = (n, d = 0) => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const money = n => `<span class="num">${nf(n, S.settings.decimals)}</span> ${esc(S.settings.currency)}`;
const moneyTxt = n => `${nf(n, S.settings.decimals)} ${S.settings.currency}`;
const km = n => `<span class="num">${nf(n)}</span> كم`;
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = String(iso).split('-'); return d ? `${d}.${m}.${y}` : iso; }
function todayISO() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
function parseDateAny(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = s.match(/^(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return '';
}
const toNum = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/[,\s]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))); return isFinite(n) ? n : null; };
const daysBetween = (a, b) => (new Date(b) - new Date(a)) / 864e5;

/* ---------- computations ---------- */
const colOf = (sec, type) => sec.columns.find(c => c.type === type);
const textCol = sec => sec.columns.find(c => c.type === 'text');
/* rows in chronological order (odometer first, then date) */
function chrono(sec) {
  const o = colOf(sec, 'odometer'), d = colOf(sec, 'date');
  return sec.rows.map((r, i) => ({ r, i })).sort((a, b) => {
    const ao = o ? toNum(a.r.v[o.id]) : null, bo = o ? toNum(b.r.v[o.id]) : null;
    if (ao != null && bo != null && ao !== bo) return ao - bo;
    const ad = d ? a.r.v[d.id] || '' : '', bd = d ? b.r.v[d.id] || '' : '';
    if (ad && bd && ad !== bd) return ad < bd ? -1 : 1;
    return (a.r.t || a.i) - (b.r.t || b.i);
  }).map(x => x.r);
}
/* distance since previous entry in the same section */
function distances(sec) {
  const o = colOf(sec, 'odometer'); const out = new Map(); if (!o) return out;
  let prev = null;
  for (const r of chrono(sec)) { const v = toNum(r.v[o.id]); if (v == null) continue; if (prev != null) out.set(r.id, v - prev); prev = v; }
  return out;
}
function sectionTotal(sec) {
  let t = 0; for (const c of sec.columns) if (c.type === 'money') for (const r of sec.rows) t += toNum(r.v[c.id]) || 0; return t;
}
function odoPoints(c) {
  const pts = [];
  for (const s of c.sections) {
    const o = colOf(s, 'odometer'), d = colOf(s, 'date'); if (!o) continue;
    for (const r of s.rows) { const v = toNum(r.v[o.id]); if (v != null) pts.push({ odo: v, date: d ? r.v[d.id] || '' : '' }); }
  }
  for (const f of c.cardFields) if (f.type === 'odometer' && toNum(f.value) != null) pts.push({ odo: toNum(f.value), date: (c.cardFields.find(x => x.type === 'date') || {}).value || '' });
  if (c.odoNow && toNum(c.odoNow.value) != null) pts.push({ odo: toNum(c.odoNow.value), date: c.odoNow.date || '' });
  return pts;
}
function currentOdo(c) { let m = 0; for (const p of odoPoints(c)) if (p.odo > m) m = p.odo; return m; }
function firstOdo(c) { const p = odoPoints(c).map(x => x.odo); return p.length ? Math.min(...p) : 0; }
/* average km/day from dated readings (ignores readings whose date goes backwards) */
function kmPerDay(c) {
  const pts = odoPoints(c).filter(p => p.date).sort((a, b) => a.odo - b.odo);
  const kept = [];
  for (const p of pts) if (!kept.length || p.date > kept[kept.length - 1].date) kept.push(p);
  if (kept.length < 2) return null;
  const last = kept[kept.length - 1];
  let first = kept[0];
  for (const p of kept) if (daysBetween(p.date, last.date) <= 365) { first = p; break; }
  if (first === last) first = kept[kept.length - 2];
  const days = daysBetween(first.date, last.date);
  if (days < 7) return null;
  return (last.odo - first.odo) / days;
}
function reminders(c) {
  const out = [];
  const cur = currentOdo(c);
  for (const s of c.sections) {
    const o = colOf(s, 'odometer');
    if (!o || !(s.reminderKm > 0)) continue;
    const rows = chrono(s).filter(r => toNum(r.v[o.id]) != null);
    if (!rows.length) { out.push({ sec: s, none: true }); continue; }
    const lastOdo = toNum(rows[rows.length - 1].v[o.id]);
    const used = Math.max(0, cur - lastOdo);
    out.push({ sec: s, lastOdo, used, next: lastOdo + s.reminderKm, left: lastOdo + s.reminderKm - cur, ratio: used / s.reminderKm });
  }
  return out;
}
/* expiry reminders (e.g. insurance) */
function expiries(c) {
  const out = []; const t = todayISO();
  for (const s of c.sections) for (const col of s.columns) {
    if (col.type !== 'date' || !/انتهاء|ينتهي|صلاحية|expiry/i.test(col.label)) continue;
    let latest = null;
    for (const r of s.rows) { const v = r.v[col.id]; if (v && (!latest || v > latest.v)) latest = { v, r }; }
    if (latest) out.push({ sec: s, col, date: latest.v, days: Math.round(daysBetween(t, latest.v)), title: (textCol(s) && latest.r.v[textCol(s).id]) || s.name });
  }
  return out;
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
let sheetStack = [];
function openSheet(title, html, onMount) {

$('#scrim').onclick = closeSheet; $('#sheetClose').onclick = closeSheet;
function confirmBox(msg, okLabel, onOk, danger = true) {

    <div class="btn-row"><button class="btn ghost" id="cNo">إلغاء</button><button class="btn ${danger ? 'danger' : ''}" id="cYes">${esc(okLabel)}</button></div>`, b => {
    b.querySelector('#cNo').onclick = closeSheet;
    b.querySelector('#cYes').onclick = () => { closeSheet(); onOk(); };
  });
}

/* ---------- theme ---------- */
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

/* ---------- navigation ---------- */
let view = 'home', activeSec = null, query = '';
function go(v) {
  view = v;

}

/* ---------- welcome ---------- */
function renderWelcome() {
  $('#v-welcome').innerHTML = `<div class="welcome">
    ${odoHTML(0, true)}
    <h1>سيّارتي</h1>
    <p>سجّل تبديل الزيت والصيانة وكل مصاريف سياراتك، وتابع موعد التبديل القادم، واحتفظ بنسخة إكسل منسّقة في الدرايف.</p>
    <button class="btn amber wide" id="wImport">استيراد من ملف إكسل</button>
    <button class="btn wide" id="wNew">إضافة سيارة جديدة</button>
  </div>`;

  $('#wNew').onclick = () => openCarEditor(null);
}

/* ---------- odometer ---------- */
function odoHTML(n, still) {
  const s = String(Math.max(0, Math.round(n))).padStart(6, '0');
  return `<div class="odo" aria-label="${nf(n)} كم" role="img">${[...s].map((d, i) => `<span class="d ${i === s.length - 1 ? 'km' : ''}"><span class="strip" data-d="${d}" style="transform:translateY(${still ? -d * 10 : 0}%)">${'0123456789'.split('').map(x => `<span>${x}</span>`).join('')}</span></span>`).join('')}</div>`;
}
let rolledFor = null;
function rollOdo(root, key) {
  const strips = root.querySelectorAll('.odo .strip');
  const run = () => strips.forEach(st => st.style.transform = `translateY(${-st.dataset.d * 10}%)`);
  if (rolledFor === key) { strips.forEach(st => { st.style.transition = 'none'; }); run(); return; }
  rolledFor = key;
  requestAnimationFrame(() => requestAnimationFrame(run));
}

/* ---------- home ---------- */
function gaugeSVG(ratio) {
  const r = Math.max(0, Math.min(1, ratio));
  const col = ratio >= 1 ? 'var(--bad)' : ratio >= .85 ? 'var(--warn)' : 'var(--ok)';
  const L = Math.PI * 50;
  return `<svg class="gauge" viewBox="0 0 120 70" aria-hidden="true">
    <path d="M10 62a50 50 0 0 1 100 0" fill="none" stroke="var(--bg)" stroke-width="12" stroke-linecap="round"/>
    <path d="M10 62a50 50 0 0 1 100 0" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L * r} ${L}"/>
    <text x="60" y="60" text-anchor="middle" font-size="19" font-weight="700" fill="var(--text)" font-family="Readex">${Math.round(ratio * 100)}%</text></svg>`;
}
function renderHome() {
  const c = car(), cur = currentOdo(c), rate = kmPerDay(c);
  const sub = [];
  const model = c.cardFields.find(f => f.label.includes('موديل') && f.value);
  if (model) sub.push('موديل ' + model.value);
  const pl = c.cardFields.find(f => f.label.includes('لوحة') && f.value);
  if (pl) sub.push('لوحة ' + pl.value);
  const rem = reminders(c), exp = expiries(c);
  const total = c.sections.reduce((a, s) => a + sectionTotal(s), 0);
  const driven = cur - firstOdo(c);
  const price = c.cardFields.find(f => f.type === 'money' && toNum(f.value));

  let dueHTML = '';
  for (const x of rem) {
    if (x.none) { dueHTML += `<div class="due"><div class="due-txt"><b>${esc(x.sec.name)}</b><small>سجّل أول عملية ليبدأ حساب الموعد القادم.</small></div></div>`; continue; }
    let eta = '';
    if (rate && x.left > 0) { const d = Math.round(x.left / rate); eta = d <= 1 ? 'خلال يوم تقريباً' : `بعد نحو ${d} يوماً حسب معدل قيادتك`; }
    const head = x.left > 0 ? `باقي ${km(x.left)}` : `متأخر ${km(-x.left)}`;
    dueHTML += `<div class="due">${gaugeSVG(x.ratio)}<div class="due-txt"><small>${esc(x.sec.name)} القادم عند ${km(x.next)}</small><b>${head}</b><small>${eta || `قطعت ${km(x.used)} من ${km(x.sec.reminderKm)}`}</small></div></div>`;
  }
  for (const e of exp) {
    const head = e.days >= 0 ? `ينتهي بعد ${e.days} يوماً` : `انتهى منذ ${-e.days} يوماً`;

/* ---------- logs ---------- */
function renderLogs() {
  const c = car();

  const s = c.sections.find(x => x.id === activeSec);
  let body = '';
  if (!s) body = `<div class="empty"><b>لا توجد أقسام</b>أضف قسماً من الإعدادات.</div>`;
  else {
    const dist = distances(s);
    const q = query.trim();
    let rows = chrono(s).reverse();
    if (q) rows = rows.filter(r => Object.values(r.v).some(v => String(v).includes(q)) || s.columns.some(c2 => c2.type === 'date' && fmtDate(r.v[c2.id]).includes(q)));
    const t = textCol(s), m = s.columns.filter(x => x.type === 'money'), o = colOf(s, 'odometer'), d = colOf(s, 'date'), dc = colOf(s, 'distance');
    const others = s.columns.filter(x => x !== t && !m.includes(x) && x !== o && x !== d && x.type !== 'distance');
    body = `
    <div class="sec-head"><div><h1>${esc(s.name)}</h1><p>${s.rows.length} ${s.rows.length === 1 ? 'تسجيل' : 'تسجيلات'}${s.note ? ' · ' + esc(s.note) : ''}</p></div>

    ${rows.length ? `<ul class="log">${rows.map(r => {
      const amt = m.reduce((a, x) => a + (toNum(r.v[x.id]) || 0), 0);

      if (d && r.v[d.id]) meta.push(`<span><b class="num">${fmtDate(r.v[d.id])}</b></span>`);
      if (dc && dist.has(r.id)) meta.push(`<span class="gap-tag">+${km(dist.get(r.id))}</span>`);
      for (const x of others) if (r.v[x.id] !== '' && r.v[x.id] != null) meta.push(`<span>${esc(x.label)}: <b>${fmtVal(x.type, r.v[x.id])}</b></span>`);

  }
  $('#v-logs').innerHTML = `<div class="seg" role="toolbar">${c.sections.map(x => `<button class="chip" data-s="${x.id}" aria-pressed="${x.id === activeSec}">${icon(x.icon, 17)} ${esc(x.name)} <span class="cnt">${x.rows.length}</span></button>`).join('')}
    <button class="chip" id="lAddSec" aria-label="إضافة قسم">+ قسم</button></div>${body}`;
  $('#v-logs').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { activeSec = b.dataset.s; query = ''; renderLogs(); });
  $('#v-logs').querySelectorAll('.entry').forEach(b => b.onclick = () => openEntry(activeSec, b.dataset.id));
  $('#lAddSec').onclick = openAddSection;
  const lq = $('#lq'); if (lq) lq.oninput = () => { query = lq.value; const pos = lq.selectionStart; renderLogs(); const n = $('#lq'); n.focus(); n.setSelectionRange(pos, pos); };
}

/* ---------- entry form ---------- */
let draft = null;
function openEntry(secId, rowId) {

  if (rowId) { const s = c.sections.find(x => x.id === draft.secId); const r = s && s.rows.find(x => x.id === rowId); if (r) draft.v = clone(r.v); }
  renderEntry();
}
function renderEntry() {
  const c = S.cars.find(x => x.id === draft.carId);
  if (!c.sections.find(x => x.id === draft.secId)) draft.secId = c.sections[0] && c.sections[0].id;

  const cur = currentOdo(c);

    for (const col of s.columns) {
      if (!editing && col.type === 'date' && !(col.id in draft.v) && !/انتهاء|ينتهي|صلاحية/.test(col.label)) draft.v[col.id] = todayISO();
      const v = draft.v[col.id] ?? '';
      if (col.type === 'distance') { fields += `<div class="field"><span>${esc(col.label)}</span><div class="calc" id="calcDist">—</div></div>`; continue; }
      const attrs = { text: 'type="text"', number: 'type="text" inputmode="decimal"', money: 'type="text" inputmode="decimal"', odometer: 'type="text" inputmode="numeric"', date: 'type="date"' }[col.type] || 'type="text"';
      const hint = col.type === 'odometer' && cur ? `<div class="hint" id="odoHint">آخر قراءة معروفة: ${nf(cur)} كم</div>` : col.type === 'money' ? `<div class="hint">${esc(S.settings.currency)}</div>` : '';
      const listId = col.type === 'text' ? `dl-${col.id}` : '';
      fields += `<label class="field"><span>${esc(col.label)}</span><input ${attrs} data-col="${col.id}" data-type="${col.type}" value="${esc(v)}" ${listId ? `list="${listId}" autocomplete="off"` : ''} ${col.type === 'number' || col.type === 'money' || col.type === 'odometer' ? 'class="num"' : ''}>${hint}</label>`;
      if (listId) { const opts = [...new Set(s.rows.map(r => r.v[col.id]).filter(Boolean))].slice(-30); fields += `<datalist id="${listId}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`; }
    }
  }
  const carsPick = S.cars.length > 1 && !editing ? `<div class="pick" aria-label="السيارة">${S.cars.map(x => `<button class="chip" data-car="${x.id}" aria-pressed="${x.id === draft.carId}"><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</button>`).join('')}</div>` : '';
  const secPick = !editing ? `<div class="pick" aria-label="القسم">${c.sections.map(x => `<button class="chip" data-sec="${x.id}" aria-pressed="${x.id === draft.secId}">${icon(x.icon, 16)} ${esc(x.name)}</button>`).join('')}</div>` : '';
  openSheet(editing ? `تعديل — ${s ? s.name : ''}` : 'تسجيل جديد', `${carsPick}${secPick}${fields}
    ${s ? `<div class="btn-row" style="margin-top:6px">${editing ? `<button class="btn danger" id="eDel">حذف</button>` : ''}<button class="btn amber" id="eSave" style="flex:2">${editing ? 'حفظ التعديل' : 'حفظ'}</button></div>` : ''}`, b => {
    b.querySelectorAll('[data-car]').forEach(x => x.onclick = () => { collect(b); draft.carId = x.dataset.car; draft.v = {}; S.activeCar = draft.carId; save(); render(); renderEntry(); });
    b.querySelectorAll('[data-sec]').forEach(x => x.onclick = () => { collect(b); draft.secId = x.dataset.sec; draft.v = {}; renderEntry(); });
    b.querySelectorAll('input[data-col]').forEach(i => i.oninput = () => { collect(b); updateCalc(b, c, s); });
    updateCalc(b, c, s);
    if ($('#eSave')) $('#eSave').onclick = () => saveEntry(b, c, s);
    if ($('#eDel')) $('#eDel').onclick = () => confirmBox('حذف هذا التسجيل نهائياً؟', 'حذف', () => { s.rows = s.rows.filter(r => r.id !== draft.rowId); save(); render(); toast('حُذف التسجيل'); });
    const first = b.querySelector('input[data-col]'); if (first && !editing && !('ontouchstart' in window)) first.focus();
  });
}
function collect(b) { b.querySelectorAll('input[data-col]').forEach(i => { draft.v[i.dataset.col] = i.value.trim(); }); }
function updateCalc(b, c, s) {
  if (!s) return;
  const o = colOf(s, 'odometer'); const el = b.querySelector('#calcDist');
  if (!o) { if (el) el.textContent = 'يحتاج عموداً من نوع العداد'; return; }
  const v = toNum(draft.v[o.id]);
  const prevRows = chrono(s).filter(r => r.id !== draft.rowId && toNum(r.v[o.id]) != null && (v == null || toNum(r.v[o.id]) < v));
  const prev = prevRows.length ? toNum(prevRows[prevRows.length - 1].v[o.id]) : null;
  if (el) el.innerHTML = v != null && prev != null ? `${km(v - prev)} <small style="color:var(--muted);font-weight:400">منذ آخر ${esc(s.name)} (${nf(prev)})</small>` : '—';
  const h = b.querySelector('#odoHint');
  if (h) { const cur = currentOdo(c); const low = v != null && cur && v < cur && !draft.rowId; h.classList.toggle('warn', !!low); h.textContent = low ? `القراءة أقل من آخر قراءة معروفة (${nf(cur)} كم) — تأكد منها` : `آخر قراءة معروفة: ${nf(cur)} كم`; }
}
function saveEntry(b, c, s) {
  collect(b);
  const v = {};
  for (const col of s.columns) {
    if (col.type === 'distance') continue;
    let x = draft.v[col.id] ?? '';
    if (['number', 'money', 'odometer'].includes(col.type) && x !== '') { const n = toNum(x); if (n == null) { toast(`«${col.label}» يجب أن يكون رقماً`); return; } x = n; }
    v[col.id] = x;
  }
  if (!Object.values(v).some(x => x !== '')) { toast('أدخل بياناً واحداً على الأقل'); return; }
  if (draft.rowId) { const r = s.rows.find(x => x.id === draft.rowId); if (r) r.v = v; }
  else s.rows.push({ id: uid(), t: Date.now(), v });
  activeSec = s.id; save(); closeSheet(); render(); toast(draft.rowId ? 'حُفظ التعديل' : `سُجّل في ${s.name} — ${c.name}`);
}

function readColEditor(b, work) {

function bindColEditor(b, work, draw) {

}

    <div class="block"><h2>أرقام</h2><dl class="kv">

/* ======================================================================
   Excel — export / import (ExcelJS, loaded on demand)
   ====================================================================== */
let excelLoading = null;
function loadExcel() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return excelLoading || (excelLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'vendor/exceljs.min.js';
    s.onload = () => res(window.ExcelJS); s.onerror = () => { excelLoading = null; rej(new Error('تعذّر تحميل مكتبة الإكسل')); };
    document.head.appendChild(s);
  }));
}
const XL = { ink: 'FF12262E', amber: 'FFE9A23B', amberSoft: 'FFFBEBD0', zebra: 'FFF2F5F4', line: 'FFCAD5D2', white: 'FFFFFFFF', muted: 'FF62747A' };
const thin = { style: 'thin', color: { argb: XL.line } };
const border = { top: thin, left: thin, bottom: thin, right: thin };
function sheetName(base, used) {
  let n = base.replace(/[\[\]\:\*\?\/\\]/g, ' ').trim().slice(0, 31) || 'ورقة';
  let k = 2, out = n; while (used.has(out)) { const suf = ` (${k++})`; out = n.slice(0, 31 - suf.length) + suf; }
  used.add(out); return out;
}
const isoToDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const colLetter = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const moneyFmt = () => S.settings.decimals ? '#,##0.' + '0'.repeat(S.settings.decimals) : '#,##0';

async function buildWorkbook(cars) {
  const ExcelJS = await loadExcel();
  const wb = new ExcelJS.Workbook();
  wb.creator = 'سيّارتي'; wb.created = new Date();
  const used = new Set();
  const multi = cars.length > 1;
  const font = (o = {}) => ({ name: 'Arial', size: 11, ...o });

  for (const c of cars) {
    /* -- card sheet -- */
    const ws = wb.addWorksheet(sheetName(multi ? `بطاقة ${c.name}` : 'بطاقة السيارة', used), { views: [{ rightToLeft: true, showGridLines: false }], properties: { tabColor: { argb: 'FF' + c.color.slice(1) } } });
    ws.columns = [{ width: 3 }, { width: 26 }, { width: 24 }];
    ws.mergeCells('B2:C2');
    const t = ws.getCell('B2'); t.value = c.name; t.font = font({ size: 20, bold: true, color: { argb: XL.white } }); t.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.ink } }; t.alignment = { vertical: 'middle', horizontal: 'center' };
    ws.getRow(2).height = 40;
    let r = 3;
    const addKV = (label, val, type, bold) => {
      const a = ws.getCell(r, 2), b = ws.getCell(r, 3);
      a.value = label; a.font = font({ bold: true, color: { argb: XL.ink } }); a.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.zebra } };
      setCell(b, type, val); b.font = font({ bold: !!bold }); a.border = border; b.border = border; b.alignment = { horizontal: 'center' };
      ws.getRow(r).height = 22; r++;
    };
    for (const f of c.cardFields) addKV(f.label, f.value, f.type);
    r++;
    const sumH = ws.getCell(r, 2); ws.mergeCells(r, 2, r, 3); sumH.value = 'ملخص'; sumH.font = font({ bold: true, color: { argb: XL.white } }); sumH.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.ink } }; sumH.alignment = { horizontal: 'center' }; r++;
    addKV('العداد الحالي', currentOdo(c), 'odometer', true);
    const total = c.sections.reduce((a, s) => a + sectionTotal(s), 0);
    for (const s of c.sections) if (s.columns.some(k => k.type === 'money')) addKV(`مجموع ${s.name}`, sectionTotal(s), 'money');
    addKV('إجمالي المصاريف', total, 'money', true);
    ws.getCell(r - 1, 2).fill = ws.getCell(r - 1, 3).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.amberSoft } };

    /* -- section sheets -- */
    for (const s of c.sections) {
      const sh = wb.addWorksheet(sheetName(multi ? `${s.name} - ${c.name}` : s.name, used), { views: [{ rightToLeft: true, state: 'frozen', ySplit: 2, showGridLines: false }], properties: { tabColor: { argb: 'FF' + c.color.slice(1) } } });
      const cols = s.columns; const N = cols.length + 1;
      sh.columns = [{ width: 6 }, ...cols.map(k => ({ width: k.type === 'text' ? (/بيان/.test(k.label) ? 40 : 22) : k.type === 'date' ? 14 : 14 }))];
      sh.mergeCells(1, 1, 1, N);
      const tt = sh.getCell(1, 1); tt.value = `${s.name} — ${c.name}${s.note ? '   (' + s.note + ')' : ''}`;
      tt.font = font({ size: 15, bold: true, color: { argb: XL.white } }); tt.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.ink } }; tt.alignment = { vertical: 'middle', horizontal: 'center' };
      sh.getRow(1).height = 32;
      const hr = sh.getRow(2); hr.height = 24;
      ['م', ...cols.map(k => k.label)].forEach((h, i) => { const cell = hr.getCell(i + 1); cell.value = h; cell.font = font({ bold: true, color: { argb: 'FF1B1306' } }); cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.amber } }; cell.alignment = { horizontal: 'center', vertical: 'middle' }; cell.border = border; });
      const rows = chrono(s);
      const oIdx = cols.findIndex(k => k.type === 'odometer');
      const dist = distances(s);
      rows.forEach((row, i) => {
        const R = sh.getRow(3 + i); R.height = 20;
        R.getCell(1).value = i + 1;
        cols.forEach((k, j) => {
          const cell = R.getCell(j + 2);
          if (k.type === 'distance') {
            if (oIdx >= 0 && i > 0 && toNum(row.v[cols[oIdx].id]) != null && toNum(rows[i - 1].v[cols[oIdx].id]) != null) {
              const L = colLetter(oIdx + 2); cell.value = { formula: `${L}${3 + i}-${L}${2 + i}`, result: dist.get(row.id) ?? 0 };
            }
            cell.numFmt = '#,##0';
          } else setCell(cell, k.type, row.v[k.id]);
        });
        for (let j = 1; j <= N; j++) { const cell = R.getCell(j); cell.border = border; cell.font = font(); cell.alignment = { horizontal: cols[j - 2] && cols[j - 2].type === 'text' ? 'right' : 'center', vertical: 'middle', wrapText: true };
          if (i % 2) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.zebra } }; }
        R.getCell(1).font = font({ color: { argb: XL.muted } });
      });
      const totR = sh.getRow(3 + rows.length); totR.height = 24;
      let anyMoney = false;
      cols.forEach((k, j) => {
        if (k.type !== 'money') return; anyMoney = true;
        const L = colLetter(j + 2); const cell = totR.getCell(j + 2);
        cell.value = { formula: rows.length ? `SUM(${L}3:${L}${2 + rows.length})` : '0', result: sectionTotal(s) }; cell.numFmt = moneyFmt();
      });
      if (anyMoney) {
        totR.getCell(1).value = 'المجموع';
        for (let j = 1; j <= N; j++) { const cell = totR.getCell(j); cell.font = font({ bold: true }); cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.amberSoft } }; cell.border = border; cell.alignment = { horizontal: 'center' }; }
      }
      sh.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 };
    }
  }
  /* -- restore data (hidden) -- */
  const hid = wb.addWorksheet('_sayyarati', { state: 'veryHidden' });
  const payload = JSON.stringify({ app: 'sayyarati', v: 1, exported: new Date().toISOString(), settings: S.settings, cars });
  hid.getCell(1, 1).value = 'sayyarati-backup-v1';
  for (let i = 0, row = 2; i < payload.length; i += 30000, row++) hid.getCell(row, 1).value = payload.slice(i, i + 30000);
  return wb;
}
function setCell(cell, type, v) {
  if (v === '' || v == null) { cell.value = null; return; }
  if (type === 'money') { cell.value = toNum(v); cell.numFmt = moneyFmt(); }
  else if (type === 'odometer') { cell.value = toNum(v); cell.numFmt = '#,##0'; }
  else if (type === 'number') { const n = toNum(v); cell.value = n == null ? String(v) : n; }
  else if (type === 'date') { const iso = parseDateAny(v); if (iso) { cell.value = isoToDate(iso); cell.numFmt = 'dd.mm.yyyy'; } else cell.value = String(v); }
  else cell.value = String(v);
}

function openBackup() {
  if (!S.cars.length) return;
  const c = car();
  openSheet('نسخة احتياطية إكسل', `
    <p style="margin:0 0 14px;color:var(--muted);font-size:14px">ستظهر قائمة المشاركة: اختر «Drive» للحفظ في جوجل درايف، أو «الملفات»، أو أرسله بالواتساب أو البريد.</p>
    ${S.cars.length > 1 ? `<div class="pick"><button class="chip" data-w="all" aria-pressed="true">كل السيارات (${S.cars.length})</button><button class="chip" data-w="one" aria-pressed="false">${esc(c.name)} فقط</button></div>` : ''}
    <button class="btn amber wide" id="bShare">${isNative ? 'تصدير ومشاركة' : 'تصدير ومشاركة / حفظ'}</button>
    ${!isNative ? `<button class="btn ghost wide" id="bDl" style="margin-top:10px">تنزيل الملف فقط</button>` : ''}
    <div class="sub-h">الاسترجاع</div>
    <p style="margin:0 0 12px;color:var(--muted);font-size:14px">اختر ملف إكسل صدّرته من التطبيق لاسترجاع كل شيء، أو أي ملف إكسل بنفس ترتيب ملفك القديم لاستيراده كسيارة.</p>
    <button class="btn ghost wide" id="bImp">استيراد / استرجاع من ملف</button>`, b => {
    let which = 'all';
    b.querySelectorAll('[data-w]').forEach(x => x.onclick = () => { which = x.dataset.w; b.querySelectorAll('[data-w]').forEach(y => y.setAttribute('aria-pressed', y === x)); });
    const run = async mode => {
      const btn = b.querySelector(mode === 'dl' ? '#bDl' : '#bShare'); const old = btn.textContent; btn.textContent = 'جارٍ تجهيز الملف…'; btn.disabled = true;
      try {
        const cars = which === 'one' ? [c] : S.cars;
        const wb = await buildWorkbook(cars);
        const buf = await wb.xlsx.writeBuffer();
        const name = `سيارتي-${which === 'one' || cars.length === 1 ? safeName(cars[0].name) + '-' : ''}${todayISO()}.xlsx`;
        const ok = await deliver(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name, mode);
        if (ok) { S.lastBackup = Date.now(); save(); closeSheet(); render(); toast('جُهّز ملف الإكسل'); }
      } catch (e) { console.error(e); toast('تعذّر إنشاء الملف: ' + (e.message || e)); }
      btn.textContent = old; btn.disabled = false;
    };
    b.querySelector('#bShare').onclick = () => run('share');
    if (b.querySelector('#bDl')) b.querySelector('#bDl').onclick = () => run('dl');
    b.querySelector('#bImp').onclick = pickImport;
  });
}
const safeName = s => String(s).replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40);
function bufToB64(buf) { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
async function deliver(blob, name, mode) {
  if (isNative) {
    const fs = plug('Filesystem'), sh = plug('Share');
    const w = await fs.writeFile({ path: 'exports/' + name, data: bufToB64(await blob.arrayBuffer()), directory: 'CACHE', recursive: true });
    try { await sh.share({ title: name, dialogTitle: 'حفظ النسخة الاحتياطية', files: [w.uri] }); }
    catch (e) { if (/cancel/i.test(String(e && e.message))) return false; throw e; }
    return true;
  }
  const file = new File([blob], name, { type: blob.type });
  if (mode !== 'dl' && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}

/* ---------- import ---------- */
function pickImport() { const f = $('#fileIn'); f.value = ''; f.click(); }
$('#fileIn').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try { await importBuffer(await file.arrayBuffer(), file.name); }
  catch (err) { console.error(err); toast('تعذّر قراءة الملف: ' + (err.message || err)); }
};
function cellVal(cell) {
  let v = cell.value;
  if (v && typeof v === 'object' && !(v instanceof Date)) {
    if ('result' in v) v = v.result;
    else if (v.richText) v = v.richText.map(t => t.text).join('');
    else if ('text' in v) v = v.text;
    else if (v.formula) v = null;
  }
  return v == null ? '' : v;
}
async function importBuffer(buf, fname) {
  const ExcelJS = await loadExcel();
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(buf);
  const hid = wb.getWorksheet('_sayyarati');
  if (hid && String(cellVal(hid.getCell(1, 1))).startsWith('sayyarati-backup')) {
    let json = ''; for (let r = 2; r <= hid.rowCount; r++) json += String(cellVal(hid.getCell(r, 1)) || '');
    const data = JSON.parse(json);
    return askRestore(data);
  }
  const c = genericImport(wb, fname);
  if (!c.sections.some(s => s.rows.length) && !c.cardFields.some(f => f.value !== '')) { toast('لم أجد بيانات يمكن استيرادها في الملف'); return; }
  const n = c.sections.reduce((a, s) => a + s.rows.length, 0);
  openSheet('استيراد سيارة', `<p style="margin:0 0 6px">وجدت في الملف:</p>
    <dl class="kv" style="margin-bottom:18px"><dt>السيارة</dt><dd>${esc(c.name)}</dd>${c.sections.map(s => `<dt>${esc(s.name)}</dt><dd>${s.rows.length} تسجيل</dd>`).join('')}<dt>بنود البطاقة</dt><dd>${c.cardFields.length}</dd></dl>
    <label class="field"><span>اسم السيارة</span><input id="giName" value="${esc(c.name)}"></label>
    <button class="btn amber wide" id="giOk">إضافة السيارة (${n} تسجيل)</button>`, b => {
    b.querySelector('#giOk').onclick = () => { c.name = b.querySelector('#giName').value.trim() || c.name; S.cars.push(c); S.activeCar = c.id; save(); closeSheet(); rolledFor = null; go('home'); toast(`استُوردت ${c.name}`); };
  });
}
function askRestore(data) {
  const cars = data.cars || [];
  const n = cars.reduce((a, c) => a + c.sections.reduce((x, s) => x + s.rows.length, 0), 0);
  openSheet('استرجاع نسخة احتياطية', `<p style="margin:0 0 16px">النسخة بتاريخ <span class="num">${fmtDate((data.exported || '').slice(0, 10))}</span> وفيها ${cars.length} ${cars.length === 1 ? 'سيارة' : 'سيارات'} و${n} تسجيل.</p>
    <button class="btn amber wide" id="rMerge">دمج مع بياناتي الحالية</button>
    <p class="hint" style="font-size:13px;color:var(--muted);margin:6px 2px 14px">السيارة الموجودة في النسختين تُستبدل بنسخة الملف، وتبقى السيارات الأخرى.</p>
    <button class="btn danger wide" id="rReplace">استبدال كل بياناتي بالنسخة</button>`, b => {
    b.querySelector('#rMerge').onclick = () => { for (const c of cars) { const i = S.cars.findIndex(x => x.id === c.id); if (i >= 0) S.cars[i] = c; else S.cars.push(c); } finishRestore(data); };
    b.querySelector('#rReplace').onclick = () => confirmBox('ستُحذف كل البيانات الحالية وتحل محلها النسخة. متابعة؟', 'استبدال', () => { S.cars = cars; finishRestore(data); });
  });
}
function finishRestore(data) {
  if (data.settings) S.settings = { ...S.settings, ...data.settings };
  if (!S.cars.find(x => x.id === S.activeCar)) S.activeCar = S.cars[0] && S.cars[0].id;
  save(); applyTheme(); closeSheet(); rolledFor = null; go('home'); toast('استُرجعت النسخة');
}
/* reads a workbook laid out like the original F150 file: one key/value sheet + table sheets */
function guessType(label) {
  if (/مسافة|المسافه/.test(label)) return 'distance';
  if (/عداد|كيلو|km/i.test(label)) return 'odometer';
  if (/تاريخ|date/i.test(label)) return 'date';
  if (/مبلغ|سعر|تكلفة|قيمة|كلفة|price|cost|amount/i.test(label)) return 'money';
  if (/موديل|سنة|لتر/.test(label)) return 'number';
  return 'text';
}
function genericImport(wb, fname) {
  const c = newCar((fname || '').replace(/\.xlsx?$/i, '') || 'سيارة');
  c.cardFields = []; c.sections = [];
  let gotName = false;
  wb.eachSheet(ws => {
    if (ws.state && ws.state !== 'visible') return;
    const grid = [];
    ws.eachRow({ includeEmpty: false }, (row, rn) => { const cells = []; row.eachCell({ includeEmpty: false }, (cell, cn) => { if (cell.isMerged && cell.master && cell.master.address !== cell.address) return; const v = cellVal(cell); if (v !== '' && v != null) cells.push({ cn, v }); }); if (cells.length) grid.push({ rn, cells }); });
    if (!grid.length) return;
    /* header row: first row with >= 3 text cells */
    const hdr = grid.find(r => r.cells.filter(x => typeof x.v === 'string').length >= 3);
    if (!hdr) {
      for (const r of grid) {
        if (r.cells.length === 1 && typeof r.cells[0].v === 'string' && !gotName) { c.name = r.cells[0].v.trim(); gotName = true; continue; }
        if (r.cells.length >= 2 && typeof r.cells[0].v === 'string') {
          const label = r.cells[0].v.trim(); let type = guessType(label); if (type === 'distance') type = 'odometer';
          if (label === 'العداد') type = 'odometer';
          let v = r.cells[1].v;
          if (type === 'date') v = parseDateAny(v) || String(v);
          else if (type !== 'text') v = toNum(v) ?? String(v);
          c.cardFields.push({ id: uid(), label, type, value: v instanceof Date ? parseDateAny(v) : v });
        }
      }
      return;
    }
    const tmpl = ws.name.includes('زيت') || ws.name.includes('زيوت') ? 'oil' : ws.name.includes('صيان') ? 'maint' : null;
    const sec = { id: tmpl && !c.sections.some(s => s.id === tmpl) ? tmpl : uid(), name: ws.name.trim(), icon: tmpl === 'oil' ? 'oil' : tmpl === 'maint' ? 'wrench' : /وقود|بنزين/.test(ws.name) ? 'fuel' : /تأمين|ترخيص/.test(ws.name) ? 'shield' : 'doc', note: '', reminderKm: tmpl === 'oil' ? 7500 : 0, columns: [], rows: [] };
    const above = grid.filter(r => r.rn < hdr.rn).flatMap(r => r.cells).filter(x => typeof x.v === 'string');
    if (above.length) sec.note = above.map(x => x.v.trim()).join(' ');
    const colMap = [];
    for (const h of hdr.cells) { if (typeof h.v !== 'string') continue; const label = h.v.trim(); const col = { id: uid(), label, type: guessType(label) }; sec.columns.push(col); colMap.push({ cn: h.cn, col }); }
    if (!sec.columns.some(x => x.type === 'odometer')) sec.columns.forEach(x => { if (x.type === 'distance') x.type = 'number'; });
    const stdIds = { 'بيان': 'desc', 'العداد': 'odo', 'المسافة': 'dist', 'التاريخ': 'date', 'المبلغ': 'amount', 'الزيت': 'oil', 'ملاحظات': 'notes' };
    if (tmpl) sec.columns.forEach(x => { if (stdIds[x.label] && !sec.columns.some(y => y.id === stdIds[x.label])) x.id = stdIds[x.label]; });
    const firstDataCol = Math.min(...colMap.map(x => x.cn));
    for (const r of grid) {
      if (r.rn <= hdr.rn) continue;
      const v = {}; let any = false;
      for (const { cn, col } of colMap) {
        if (col.type === 'distance') continue;
        const cell = r.cells.find(x => x.cn === cn); if (!cell) { v[col.id] = ''; continue; }
        let x = cell.v;
        if (col.type === 'date') x = parseDateAny(x) || String(x);
        else if (col.type === 'money' || col.type === 'odometer' || col.type === 'number') { const n = toNum(x); x = n == null ? String(x) : n; }
        else x = x instanceof Date ? fmtDate(parseDateAny(x)) : String(x).trim();
        v[col.id] = x; if (x !== '') any = true;
      }
      /* skip totals row: only money cells filled and nothing else */
      const nonMoney = sec.columns.filter(k => k.type !== 'money' && k.type !== 'distance').some(k => v[k.id] !== '' && v[k.id] != null);
      if (!any || !nonMoney) continue;
      sec.rows.push({ id: uid(), t: Date.now() + sec.rows.length, v });
    }
    c.sections.push(sec);
  });
  if (!c.cardFields.length) c.cardFields = defaultCardFields();
  if (!c.sections.length) c.sections = [SECTION_TEMPLATES.oil(), SECTION_TEMPLATES.maint()];
  return c;
}

/* ---------- native back button ---------- */
function initNative() {
  const app = plug('App'); if (!app) return;
  app.addListener('backButton', () => {
    if ($('#sheet').classList.contains('on')) { closeSheet(); return; }
    if (view !== 'home') { go('home'); return; }
    app.minimizeApp ? app.minimizeApp() : app.exitApp();
  });
}

/* ---------- boot ---------- */
(async function boot() {
  S = loadLocal();
  if (isNative) { const n = await loadNative(); if (n && (!S || (n.rev || 0) > (S.rev || 0))) S = n; }
  if (!S) S = blankState();
  S.settings = { ...blankState().settings, ...(S.settings || {}) };
  if (S.cars.length && !S.cars.find(x => x.id === S.activeCar)) S.activeCar = S.cars[0].id;
  applyTheme(); render();
  if (isNative) initNative();
  if (!isNative && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.__sayyarati = { get state() { return S; }, importBuffer, buildWorkbook };
})();
</script>
