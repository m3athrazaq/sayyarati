<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيّارتي</title>
<meta name="description" content="سجل السيارة: الزيوت والصيانة والمصاريف لأكثر من سيارة، مع نسخة احتياطية بملف إكسل.">
<meta name="theme-color" content="#12262E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سيّارتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Readex";font-weight:300;font-display:swap;src:url(fonts/readex-pro-arabic-300-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:400;font-display:swap;src:url(fonts/readex-pro-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:500;font-display:swap;src:url(fonts/readex-pro-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:700;font-display:swap;src:url(fonts/readex-pro-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Readex";font-weight:300;font-display:swap;src:url(fonts/readex-pro-latin-300-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:"Readex";font-weight:400;font-display:swap;src:url(fonts/readex-pro-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:"Readex";font-weight:500;font-display:swap;src:url(fonts/readex-pro-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:"Readex";font-weight:700;font-display:swap;src:url(fonts/readex-pro-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}

:root{
  --ink:#12262E;        /* deep petrol — instrument panel */
  --ink-2:#1C3943;
  --amber:#E9A23B;      /* dashboard backlight */
  --amber-soft:#F6DDB1;
  --steel:#5F7177;
  --line:#D5DEDC;
  --bg:#E8EDEC;
  --card:#FFFFFF;
  --text:#14242A;
  --muted:#62747A;
  --ok:#2F7D5B;
  --warn:#C9842A;
  --bad:#B9452F;
  --car:#E9A23B;
  --shadow:0 1px 0 rgba(18,38,46,.06),0 8px 24px -14px rgba(18,38,46,.35);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D1A1F; --card:#15252B; --text:#E6EEEC; --muted:#8FA3A8; --line:#24383F;
  --ink:#091317; --ink-2:#12262E; --steel:#8FA3A8; --amber-soft:#3A2F1C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A1F; --card:#15252B; --text:#E6EEEC; --muted:#8FA3A8; --line:#24383F;
    --ink:#091317; --ink-2:#12262E; --steel:#8FA3A8; --amber-soft:#3A2F1C;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Readex",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55;
  min-height:100dvh;padding-bottom:calc(92px + env(safe-area-inset-bottom));font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px}
.car-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:999px;padding:7px 14px 7px 10px;min-width:0;flex:1;max-width:max-content}
.car-pill .dot{width:12px;height:12px;border-radius:50%;background:var(--car);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.car-pill b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-pill svg{flex:none;opacity:.7}
.top .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:inherit}
.icon-btn:active{background:rgba(255,255,255,.1)}

main{max-width:720px;margin:0 auto;padding:0 16px}
.view{display:none}
.view.on{display:block}

/* ---------- hero: instrument cluster ---------- */
.cluster{background:var(--ink);color:#fff;margin:0 -16px;padding:6px 20px 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.cluster::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:120%;background:radial-gradient(closest-side,rgba(233,162,59,.16),transparent);pointer-events:none}
.car-name{font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:8px 0 2px;word-break:break-word}
.car-sub{color:#A9BCC1;font-size:14px;margin:0 0 18px}
.odo-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.odo-label{font-size:13px;color:#A9BCC1;margin-bottom:6px}
.odo{display:inline-flex;direction:ltr;gap:4px;padding:8px;background:#06100F;border-radius:12px;box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.odo .d{width:min(9vw,40px);height:min(13vw,56px);overflow:hidden;border-radius:6px;background:linear-gradient(#1a2a2e,#0c1719 45%,#0c1719 55%,#1a2a2e);position:relative}
.odo .d::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.odo .strip{display:flex;flex-direction:column;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.odo .strip span{height:min(13vw,56px);display:grid;place-items:center;font-size:min(8vw,34px);font-weight:500;color:#F3EEE4}
.odo .d.km{background:linear-gradient(#5a3d12,#2c1e0a 45%,#2c1e0a 55%,#5a3d12)}
.odo .d.km span{color:var(--amber)}
.odo-unit{font-size:14px;color:#A9BCC1;margin-inline-start:6px;align-self:flex-end;padding-bottom:6px}
.odo-btn{background:var(--amber);color:#1b1306;font-weight:500;border-radius:999px;padding:9px 16px;font-size:14px}
@media (prefers-reduced-motion:reduce){.odo .strip{transition:none}}

/* ---------- blocks ---------- */
.block{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.block h2{font-size:17px;font-weight:500;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.block h2 .act{margin-inline-start:auto;font-size:14px;color:var(--muted);font-weight:400;padding:4px 8px;border-radius:8px}
.lift{margin-top:-14px;position:relative;z-index:2}

.due{display:flex;gap:16px;align-items:center}
.gauge{flex:none;width:118px;height:70px}
.due-txt b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.due-txt small{color:var(--muted);font-size:13.5px;display:block}
.due-list .due + .due{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stat{padding:2px 10px}
.stat + .stat{border-inline-start:1px solid var(--line)}
.stat:first-child{padding-inline-start:0}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{font-size:17px;font-weight:500;white-space:nowrap}
.stat em{font-style:normal;font-size:12px;color:var(--muted);margin-inline-start:3px}

.kv{display:grid;grid-template-columns:fit-content(48%) minmax(0,1fr);gap:9px 16px;margin:0}
.kv dt,.kv dd,.entry-title,.entry-meta span,.list-item .grow,.sec-head h1,.sec-head p,.due-txt,.car-sub,.field > span{overflow-wrap:anywhere;min-width:0}
.kv dt{color:var(--muted);font-size:14.5px}
.kv dd{margin:0;text-align:end;font-weight:500}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-track{height:10px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;background:var(--car);border-radius:6px}

/* ---------- records ---------- */
.seg{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--amber);color:#1b1306}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--amber);color:#1b1306}}
.chip .cnt{font-size:12px;opacity:.65}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 2px 6px}
.sec-head h1{font-size:28px;margin:0;font-weight:700;line-height:1.1}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec-total{text-align:end}
.sec-total small{display:block;color:var(--muted);font-size:12.5px}
.sec-total b{font-size:20px}
.search{width:100%;margin:10px 0 4px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:11px 14px}

.log{list-style:none;margin:10px 0 0;padding:0;position:relative}
.log li{position:relative;padding-inline-start:26px}
.log li::before{content:"";position:absolute;inset-inline-start:7px;top:0;bottom:0;width:2px;background:var(--line)}
.log li:first-child::before{top:26px}
.log li:last-child::before{bottom:calc(100% - 26px)}
.log li::after{content:"";position:absolute;inset-inline-start:2px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--car)}
.entry{display:block;width:100%;text-align:start;background:var(--card);border-radius:var(--r-md);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.entry-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.entry-title{font-weight:500;font-size:15.5px}
.entry-amt{font-weight:500;white-space:nowrap}
.entry-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px;margin-top:5px}
.entry-meta span b{color:var(--text);font-weight:500}
.gap-tag{display:inline-block;background:var(--amber-soft);color:#6b4a12;border-radius:6px;padding:0 7px;font-size:12.5px}
:root[data-theme="dark"] .gap-tag{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gap-tag{color:var(--amber)}}

.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:500;margin-bottom:6px}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);padding:13px 18px;font-weight:500;background:var(--ink);color:#fff;min-height:48px}
.btn.amber{background:var(--amber);color:#1b1306}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}
:root[data-theme="dark"] .btn:not(.amber):not(.ghost):not(.danger){background:#2A4650}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.amber):not(.ghost):not(.danger){background:#2A4650}}

.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:12px 13px;min-height:48px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.field .hint.warn{color:var(--warn)}
.calc{background:var(--bg);border-radius:var(--r-sm);padding:12px 13px;font-weight:500}
input[type="number"]{direction:ltr;text-align:right}
input[type="date"]{direction:ltr;text-align:right}

/* ---------- bottom nav ---------- */
.nav{position:fixed;inset:auto 0 0 0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button[aria-current="page"]{color:var(--text);font-weight:500}
.nav button[aria-current="page"] svg{color:var(--amber)}
.fab{width:62px!important;height:62px;justify-self:center;margin-top:-30px;border-radius:50%!important;background:var(--amber)!important;color:#1b1306!important;
  box-shadow:0 10px 24px -8px rgba(233,162,59,.8),0 0 0 6px var(--bg);display:grid!important;place-items:center}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,17,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:41;background:var(--card);border-radius:26px 26px 0 0;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;max-width:720px;margin:0 auto;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 18px 6px;position:relative}
.sheet-head::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-head h3{margin:12px 0 4px;font-size:20px;font-weight:700;flex:1}
.sheet-body{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.pick{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick .chip{box-shadow:none;border:1px solid var(--line)}
.pick .chip .dot{width:10px;height:10px;border-radius:50%}

.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item small{display:block;color:var(--muted);font-size:13px}
.list-item .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--steel)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--text)}

.col-edit{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col-edit input,.col-edit select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:9px 10px;min-height:42px}
.col-edit .tools{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.col-edit .tools button{width:38px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--steel)}
.col-edit .tools button.del{color:var(--bad)}
.sub-h{font-size:15px;font-weight:500;margin:18px 0 10px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--amber)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;
  z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:14.5px;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* welcome */
.welcome{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
.welcome h1{font-size:44px;line-height:1.05;margin:16px 0 10px}
.welcome p{color:var(--muted);margin:0 0 26px;max-width:34ch}
.welcome .btn{margin-bottom:10px}
.backup-note{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border-radius:var(--r-md);padding:11px 14px;font-size:14px;margin-top:14px}
.backup-note button{margin-inline-start:auto;font-weight:500;text-decoration:underline}
</style>
</head>
<body>

<header class="top" id="top">
  <button class="car-pill" id="carPill" aria-label="تبديل السيارة">
    <span class="dot"></span><b id="carPillName">—</b>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <span class="sp"></span>
  <button class="icon-btn" id="quickExport" aria-label="نسخة احتياطية إكسل">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
  </button>
</header>

<main>
  <section class="view" id="v-welcome"></section>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-logs"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-settings"></section>
</main>

<nav class="nav" id="nav">
  <button data-v="home" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg>
    السيارة</button>
  <button data-v="logs">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
    السجلات</button>
  <button class="fab" id="fab" aria-label="تسجيل جديد">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
